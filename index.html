:root{

<script>
'use strict';
const VERSION = '1.8';
/* ================= Preferencias y unidades ================= */
const PREF_KEY = 'mosca.prefs';
let PREFS = { vel:'fps' };
try{ Object.assign(PREFS, JSON.parse(localStorage.getItem(PREF_KEY)||'{}')); }catch(e){}
const guardarPrefs = () => { try{ localStorage.setItem(PREF_KEY, JSON.stringify(PREFS)); }catch(e){} };
const FPS = 3.280839895;
const UV = () => PREFS.vel==='fps' ? 'fps' : 'm/s';
const velOut = ms => ms==null ? null : (PREFS.vel==='fps' ? ms*FPS : ms);   // interno (m/s) -> pantalla
const velIn  = x  => x==null ? null : (PREFS.vel==='fps' ? x/FPS : x);      // pantalla -> interno (m/s)
const CAMPOS_VEL = ['v0','velocidades'];
/* ================= Base de datos (IndexedDB) ================= */
const STORES = ['armas','cargas','sesiones','fundicion','fotos','consultas'];
let dbp;
function db(){
  if(!dbp) dbp = new Promise((res,rej)=>{
    const r = indexedDB.open('mosca',2);
    r.onupgradeneeded = () => { for(const s of STORES) if(!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s,{keyPath:'id'}); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(store, mode, fn){
  const d = await db();
  return new Promise((res,rej)=>{ const t = d.transaction(store,mode); const out = fn(t.objectStore(store)); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out); t.onerror=()=>rej(t.error); });
}
const todos = s => tx(s,'readonly',o=>o.getAll());
const uno = (s,id) => tx(s,'readonly',o=>o.get(id));
const guardar = (s,obj) => tx(s,'readwrite',o=>o.put(obj));
const borrar = (s,id) => tx(s,'readwrite',o=>o.delete(id));
const nuevoId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
if(navigator.storage && navigator.storage.persist) navigator.storage.persist();

/* ================= Esquemas ================= */

/* ================= Ayudas para cada dato ================= */
// data-fill="campo=valor;campo2=valor2" carga valores típicos con un toque

function htmlAyuda(store, k){
  const t = AYUDA[store+'.'+k]; if(!t) return '';
  return `<details class="ayuda"><summary>¿Cómo lo sé?</summary><div>${t}</div></details>`;
}
// conecta los botones "No sé…" para que completen los campos del formulario
function engancharAyudas(prefijo){
  app.querySelectorAll('[data-fill]').forEach(b => b.onclick = () => {
    b.dataset.fill.split(';').forEach(par => { const [k,v] = par.split('='); const el = $('#'+prefijo+k); if(el){ el.value = v; el.dispatchEvent(new Event('change')); } });
    toast('Listo'); b.closest('details') && b.closest('details').removeAttribute('open');
  });
}

/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { if(v===''||v==null) return null; const n = parseFloat(String(v).replace(',','.')); return isFinite(n)?n:null; };
const lista = s => String(s||'').split(/[;,\s]+/).map(x=>num(x)).filter(x=>x!=null);
const f = (n,d=1) => n==null||!isFinite(n) ? '—' : n.toFixed(d);
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display='none',2000); }
const hoy = () => new Date().toISOString().slice(0,10);
const etiqueta = lab => lab.replace('{VEL}', UV());
// convierte un campo de velocidad guardado (m/s) a texto en la unidad elegida
function velTexto(k, v){
  if(v==null || v==='') return '';
  if(k==='v0') return f(velOut(num(v)), PREFS.vel==='fps'?0:1);
  return lista(v).map(x=>f(velOut(x), PREFS.vel==='fps'?0:1)).join(', ');
}

function statsSesion(s){
  const v = Balistica.estadisticaVelocidades(lista(s.velocidades));
  const g = lista(s.gruposMm);
  const d = num(s.distanciaM);
  let grupos = null;
  if(g.length && d){
    const prom = g.reduce((a,b)=>a+b,0)/g.length;
    grupos = { n:g.length, promMm:prom, mejorMm:Math.min(...g), promMoa:Balistica.grupoAngular(prom,d).moa, mejorMoa:Balistica.grupoAngular(Math.min(...g),d).moa };
  }
  return { vel:v, grupos };
}
async function conteoArma(arma){
  const ses = (await todos('sesiones')).filter(s=>s.armaId===arma.id);
  return (num(arma.disparosPrevios)||0) + ses.reduce((a,s)=>a+(num(s.disparos)||0),0);
}

/* ================= Navegación ================= */
let vista = 'armas';
function ir(v, ...args){ vista=v; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); window.scrollTo(0,0); VISTAS[v](...args); }
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>ir(b.dataset.v));

/* ================= Listados ================= */
async function listado(store){
  const e = ESQ[store];
  const items = await todos(store);
  const armas = Object.fromEntries((await todos('armas')).map(a=>[a.id,a]));
  const cargas = Object.fromEntries((await todos('cargas')).map(c=>[c.id,c]));
  items.sort((a,b)=> String(b.fecha||b.creado||'').localeCompare(String(a.fecha||a.creado||'')));
  let html = `<div class="row" style="align-items:center"><h2 style="flex:3">${e.titulo}</h2><button class="btn" style="flex:0 0 auto" id="nuevo">+ Nueva</button></div>`;
  if(store==='fundicion') html = `<button class="btn sec" id="volver" style="margin-top:6px">← Volver</button>` + html;
  if(!items.length) html += `<div class="vacio">Todavía no hay ${e.titulo.toLowerCase()} cargadas.</div>`;
  for(const it of items){
    let t='', s='', extra='';
    if(store==='armas'){ t=it.nombre; s=[it.marca,it.modelo,it.calibre].filter(Boolean).join(' · '); extra=`<div class="s">${await conteoArma(it)} disparos · cero ${esc(it.ceroM||'—')} m</div>`; }
    if(store==='cargas'){ t=it.nombre; const cls={aprobada:'ok',descartada:'bad','en prueba':'prueba'}[it.estado]||''; t=esc(t)+(it.estado?`<span class="chip ${cls}">${esc(it.estado)}</span>`:''); s=[it.puntaPesoGr&&it.puntaPesoGr+' gr',it.puntaMarca,it.puntaModelo,it.polvora&&(it.polvora+(it.cargaGr?' '+it.cargaGr+' gr':''))].filter(Boolean).join(' · '); }
    if(store==='fundicion'){ t='Lote '+(it.lote||''); s=[it.fecha,it.aleacion,it.pesoPromGr&&it.pesoPromGr+' gr',it.durezaBHN&&it.durezaBHN+' BHN'].filter(Boolean).join(' · '); }
    if(store==='sesiones'){
      const st = statsSesion(it);
      t = (it.fecha||'')+' · '+(armas[it.armaId]?.nombre||'sin arma');
      s = [cargas[it.cargaId]?.nombre, it.distanciaM&&it.distanciaM+' m', it.tipo, it.lugar].filter(Boolean).join(' · ');
      if(st.grupos||st.vel) extra = `<div class="s">${st.grupos?`grupo prom. ${f(st.grupos.promMoa,2)} MOA (${f(st.grupos.promMm,0)} mm)`:''}${st.grupos&&st.vel?' · ':''}${st.vel?`${f(velOut(st.vel.prom),0)} ${UV()}, DE ${f(velOut(st.vel.sd),1)}`:''}</div>`;
    }
    html += `<div class="card click" data-id="${it.id}"><div class="t">${store==='cargas'?t:esc(t)}</div><div class="s">${esc(s)}</div>${extra}</div>`;
  }
  app.innerHTML = html;
  $('#nuevo').onclick = () => formulario(store);
  if($('#volver')) $('#volver').onclick = () => ir('mas');
  if(store==='armas'){ app.insertAdjacentHTML('beforeend', `<button class="btn sec full" id="ceroLista" style="margin-top:6px">🎯 Calibrar una mira (asistente)</button>`); $('#ceroLista').onclick = () => vistaCero(); }
  app.querySelectorAll('.card.click').forEach(c=>c.onclick=()=>detalle(store,c.dataset.id));
}

/* ================= Formulario genérico ================= */
async function formulario(store, id, preset){
  const e = ESQ[store];
  const it = id ? await uno(store,id) : Object.assign({}, preset||{});
  if(!id && store==='sesiones' && !it.fecha) it.fecha = hoy();
  const refs = {};
  for(const c of e.campos) if(c[2].startsWith('ref:')) refs[c[2].slice(4)] = await todos(c[2].slice(4));
  let html = `<h2>${id?'Editar':'Nueva'} ${e.singular}</h2><form id="frm">`;
  for(const [k,lab,tipo,req,opts] of e.campos){
    const v = CAMPOS_VEL.includes(k) ? velTexto(k, it[k]) : (it[k]??'');
    html += `<label for="f_${k}">${esc(etiqueta(lab))}${req?' *':''}</label>${htmlAyuda(store,k)}`;
    if(tipo==='textarea') html += `<textarea id="f_${k}" name="${k}">${esc(v)}</textarea>`;
    else if(tipo==='select') html += `<select id="f_${k}" name="${k}"><option value=""></option>${opts.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(tipo.startsWith('ref:')){
      const rs = refs[tipo.slice(4)];
      html += `<select id="f_${k}" name="${k}"><option value="">—</option>${rs.map(r=>`<option value="${r.id}"${r.id===v?' selected':''}>${esc(r.nombre||('Lote '+r.lote))}</option>`).join('')}</select>`;
    } else html += `<input id="f_${k}" name="${k}" type="${tipo==='number'?'text':tipo}" ${tipo==='number'?'inputmode="decimal"':''} value="${esc(v)}" ${req?'required':''}>`;
  }
  html += `<div class="acts"><button type="button" class="btn sec" id="cancelar">Cancelar</button><button class="btn">Guardar</button></div></form>`;
  app.innerHTML = html;
  $('#cancelar').onclick = () => id ? detalle(store,id) : ir(vista);
  engancharAyudas('f_');
  // si escribe el modelo de la mira (ej. 3-9x40), completo el objetivo solo
  if($('#f_mira') && $('#f_objetivoMm')) $('#f_mira').addEventListener('input', ev => {
    const m = ev.target.value.match(/x\s*(\d{2,3})\b/i);
    if(m && !$('#f_objetivoMm').value) $('#f_objetivoMm').value = m[1];
  });
  $('#frm').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const obj = Object.assign({}, it, { id: it.id||nuevoId(), creado: it.creado||new Date().toISOString(), modificado:new Date().toISOString() });
    for(const [k,,tipo] of e.campos){ const v = (fd.get(k)||'').toString().trim(); obj[k] = tipo==='number' ? num(v) : v; }
    if('v0' in obj) obj.v0 = obj.v0==null ? null : velIn(obj.v0);
    if('velocidades' in obj) obj.velocidades = lista(obj.velocidades).map(x=>+velIn(x).toFixed(3)).join(', ');
    await guardar(store,obj); toast('Guardado'); detalle(store,obj.id);
  };
}

/* ================= Detalle ================= */
async function detalle(store, id){
  const e = ESQ[store];
  const it = await uno(store,id);
  if(!it){ ir(vista); return; }
  const nombres = {};
  for(const s of ['armas','cargas','fundicion']) for(const r of await todos(s)) nombres[r.id] = r.nombre || ('Lote '+r.lote);
  let html = `<button class="btn sec" id="volver" style="margin-top:6px">← Volver</button>`;
  html += `<h2>${esc(it.nombre || (it.lote&&'Lote '+it.lote) || it.fecha || e.singular)}</h2><div class="card">`;
  for(const [k,lab,tipo] of e.campos){
    let v = it[k]; if(v==null||v==='') continue;
    if(tipo.startsWith('ref:')) v = nombres[v]||'(borrado)';
    if(CAMPOS_VEL.includes(k)) v = velTexto(k, v);
    html += `<div style="margin:3px 0"><span class="s">${esc(etiqueta(lab))}:</span> ${esc(v)}</div>`;
  }
  html += `</div>`;
  if(store==='armas'){
    const n = await conteoArma(it);
    const ses = (await todos('sesiones')).filter(s=>s.armaId===id);
    html += `<div class="stats"><div class="stat"><b>${n}</b><i>disparos</i></div><div class="stat"><b>${ses.length}</b><i>sesiones</i></div></div>`;
    html += `<div class="acts"><button class="btn full" id="irCero">🎯 Calibrar la mira (asistente paso a paso)</button></div>`;
  }
  if(store==='cargas'){
    const ses = (await todos('sesiones')).filter(s=>s.cargaId===id);
    const vs = ses.flatMap(s=>lista(s.velocidades)); const v = Balistica.estadisticaVelocidades(vs);
    const gm = ses.map(s=>statsSesion(s).grupos).filter(Boolean);
    html += `<div class="stats"><div class="stat"><b>${ses.length}</b><i>sesiones</i></div>
      <div class="stat"><b>${v?f(velOut(v.prom),0):'—'}</b><i>${UV()} promedio (${v?v.n:0} tiros)</i></div>
      <div class="stat"><b>${v?f(velOut(v.sd),1):'—'}</b><i>desvío estándar</i></div>
      <div class="stat"><b>${gm.length?f(Math.min(...gm.map(g=>g.mejorMoa)),2):'—'}</b><i>mejor grupo (MOA)</i></div></div>`;
    if(v && !it.v0) html += `<p class="nota">Tenés ${v.n} velocidades medidas: podés usar ${f(velOut(v.prom),0)} ${UV()} como velocidad en boca.</p>`;
  }
  if(store==='sesiones'){
    const st = statsSesion(it);
    if(st.vel) html += `<div class="stats"><div class="stat"><b>${f(velOut(st.vel.prom),0)}</b><i>${UV()} promedio</i></div><div class="stat"><b>${f(velOut(st.vel.sd),1)}</b><i>desvío est. (DE)</i></div><div class="stat"><b>${f(velOut(st.vel.es),1)}</b><i>disp. extrema (ES)</i></div><div class="stat"><b>${st.vel.n}</b><i>tiros medidos</i></div></div>`;
    if(st.grupos) html += `<div class="stats"><div class="stat"><b>${f(st.grupos.promMoa,2)}</b><i>MOA promedio</i></div><div class="stat"><b>${f(st.grupos.mejorMoa,2)}</b><i>mejor grupo MOA</i></div><div class="stat"><b>${f(st.grupos.promMm,0)}</b><i>mm promedio</i></div><div class="stat"><b>${st.grupos.n}</b><i>grupos</i></div></div>`;
    html += `<h2>Diana</h2><div id="dianaBox"></div>`;
    const cons = (await todos('consultas')).filter(c=>c.sesionId===id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
    html += `<h2>Consultas a la IA</h2>${cons.map(c=>tarjetaConsulta(c,{})).join('')}<button class="btn sec full" id="iaSesion">✦ Preguntar a la IA sobre esta sesión</button>`;
    const fotos = (await todos('fotos')).filter(p=>p.sesionId===id);
    html += `<h2>Fotos de blancos</h2><div class="fotos">${fotos.map(p=>`<img src="${p.data}" data-id="${p.id}" alt="blanco">`).join('')}</div>
      <label class="btn sec" style="display:inline-block;margin-top:8px;color:var(--tx)">📷 Agregar foto<input type="file" accept="image/*" capture="environment" id="foto" hidden></label>`;
  }
  html += `<div class="acts"><button class="btn bad" id="borrar">Borrar</button><button class="btn sec" id="duplicar">Duplicar</button><button class="btn" id="editar">Editar</button></div>`;
  if(store==='sesiones' || store==='cargas') html += `<div class="acts"><button class="btn sec full" id="nuevaSes">${store==='cargas'?'+ Sesión con esta carga':'+ Otra sesión igual (hoy)'}</button></div>`;
  app.innerHTML = html;
  $('#volver').onclick = () => store==='fundicion' ? listado('fundicion') : ir(vista);
  $('#editar').onclick = () => formulario(store,id);
  $('#duplicar').onclick = async () => { const c = Object.assign({}, it, {id:nuevoId(), creado:new Date().toISOString()}); if(c.nombre) c.nombre += ' (copia)'; if(store==='sesiones') c.fecha=hoy(); await guardar(store,c); formulario(store,c.id); };
  $('#borrar').onclick = async () => { if(!confirm('¿Borrar definitivamente?')) return; await borrar(store,id); if(store==='sesiones') for(const p of (await todos('fotos')).filter(p=>p.sesionId===id)) await borrar('fotos',p.id); toast('Borrado'); store==='fundicion'?listado('fundicion'):ir(vista); };
  if($('#nuevaSes')) $('#nuevaSes').onclick = () => { vista='sesiones'; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==='sesiones'));
    formulario('sesiones', null, store==='cargas' ? {cargaId:id, armaId:it.armaId||''} : {armaId:it.armaId,cargaId:it.cargaId,lugar:it.lugar,distanciaM:it.distanciaM,tipo:it.tipo,tirosPorGrupo:it.tirosPorGrupo}); };
  if(store==='armas') $('#irCero').onclick = () => vistaCero(id);
  if(store==='sesiones'){ dianaSesion(it); $('#iaSesion').onclick = () => vistaIA(id);
    app.querySelectorAll('[data-borrarc]').forEach(a => a.onclick = async ev => { ev.preventDefault(); if(!confirm('¿Borrar esta consulta?')) return; await borrar('consultas', a.dataset.borrarc); detalle(store,id); }); }
  if($('#foto')) $('#foto').onchange = async ev => {
    const file = ev.target.files[0]; if(!file) return;
    const data = await comprimir(file);
    await guardar('fotos',{id:nuevoId(), sesionId:id, data, fecha:new Date().toISOString()});
    detalle(store,id);
  };
  app.querySelectorAll('.fotos img').forEach(img=>img.onclick=()=>{
    const d=$('#dlg'); d.innerHTML=`<img src="${img.src}"><div class="acts"><button class="btn bad" id="bf">Borrar foto</button><button class="btn" id="cf">Cerrar</button></div>`;
    d.showModal(); $('#cf').onclick=()=>d.close(); $('#bf').onclick=async()=>{ await borrar('fotos',img.dataset.id); d.close(); detalle(store,id); };
  });
}
/* ================= Diana: marcar impactos ================= */
const COLORES_G = ['#c0392b','#2c6fbb','#1e8449','#8e44ad','#d35400','#117a65'];
function analisisGrupo(pts, distM){
  if(!pts.length) return null;
  const mx = pts.reduce((a,p)=>a+p.x,0)/pts.length, my = pts.reduce((a,p)=>a+p.y,0)/pts.length;
  let es = 0;
  for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++) es = Math.max(es, Math.hypot(pts[i].x-pts[j].x, pts[i].y-pts[j].y));
  const r = { n:pts.length, mpiX:mx, mpiY:my, esMm:es*10 };
  if(distM){
    const cmPorMoa = distM * Math.tan(Math.PI/10800) * 100;
    r.esMoa = es / cmPorMoa;
    r.mpiXMoa = mx / cmPorMoa; r.mpiYMoa = my / cmPorMoa;
  }
  return r;
}
function analisisDiana(s){
  const imp = s.impactos || [];
  const gs = [...new Set(imp.map(p=>p.g))].sort((a,b)=>a-b);
  const d = num(s.distanciaM);
  return { grupos: gs.map(g => Object.assign({g}, analisisGrupo(imp.filter(p=>p.g===g), d))), total: analisisGrupo(imp, d) };
}
async function dianaSesion(s){
  const box = $('#dianaBox'); if(!box) return;
  const arma = s.armaId ? await uno('armas', s.armaId) : null;
  let S = s.dianaCm || 30;                 // ancho de la diana en cm
  let g = Math.max(1, ...((s.impactos||[]).map(p=>p.g)), 1);
  if(!(s.impactos||[]).length) g = 1;
  async function persistir(){ s.modificado = new Date().toISOString(); await guardar('sesiones', s); }
  function pintar(){
    const imp = s.impactos || [];
    const r = S/2, paso = S/10;
    let svg = `<svg class="diana" id="dianaSvg" viewBox="${-r} ${-r} ${S} ${S}" xmlns="http://www.w3.org/2000/svg">`;
    for(let i=5;i>=1;i--) svg += `<circle cx="0" cy="0" r="${i*paso}" fill="${i<=2?'#1c1c1c':'none'}" stroke="${i<=2?'#efe9d8':'#1c1c1c'}" stroke-width="${S/400}"/>`;
    svg += `<line x1="${-r}" y1="0" x2="${r}" y2="0" stroke="#7a7a7a" stroke-width="${S/600}"/><line x1="0" y1="${-r}" x2="0" y2="${r}" stroke="#7a7a7a" stroke-width="${S/600}"/>`;
    svg += `<text x="${-r+S/60}" y="${r-S/60}" font-size="${S/28}" fill="#7a7a7a">${S} cm · anillos cada ${f(paso,1)} cm</text>`;
    const an = analisisDiana(s);
    for(const gr of an.grupos){
      if(gr.n>1) svg += `<circle cx="${gr.mpiX}" cy="${-gr.mpiY}" r="${S/90}" fill="none" stroke="${COLORES_G[(gr.g-1)%6]}" stroke-width="${S/300}"/><line x1="${gr.mpiX-S/45}" y1="${-gr.mpiY}" x2="${gr.mpiX+S/45}" y2="${-gr.mpiY}" stroke="${COLORES_G[(gr.g-1)%6]}" stroke-width="${S/400}"/><line x1="${gr.mpiX}" y1="${-gr.mpiY-S/45}" x2="${gr.mpiX}" y2="${-gr.mpiY+S/45}" stroke="${COLORES_G[(gr.g-1)%6]}" stroke-width="${S/400}"/>`;
    }
    imp.forEach((p,i) => {
      const c = COLORES_G[(p.g-1)%6];
      svg += `<circle cx="${p.x}" cy="${-p.y}" r="${S/70}" fill="${c}" stroke="#fff" stroke-width="${S/500}" opacity="${p.g===g?1:.55}"/>`;
    });
    svg += `</svg>`;
    const gruposExist = [...new Set(imp.map(p=>p.g))]; if(!gruposExist.includes(g)) gruposExist.push(g); gruposExist.sort((a,b)=>a-b);
    let html = svg + `<div class="gsel">${gruposExist.map(n=>`<button data-g="${n}" class="${n===g?'on':''}" style="border-left:6px solid ${COLORES_G[(n-1)%6]}">Grupo ${n}</button>`).join('')}
      <button id="gNuevo">+ Grupo</button>
      <select id="dTam" style="width:auto;padding:5px 8px;font-size:13px">${[10,20,30,50,100].map(v=>`<option value="${v}"${v===S?' selected':''}>${v} cm</option>`).join('')}</select></div>
      <p class="nota">Tocá la diana para marcar cada impacto del grupo elegido. Si te equivocás, usá «Deshacer último». El centro es tu punto de mira.${num(s.distanciaM)?'':' <b>Cargá la distancia de la sesión para ver los MOA y los clicks.</b>'}</p>`;
    const res = an.grupos.filter(x=>x.n);
    if(res.length){
      html += `<div class="stats">`;
      for(const gr of res){
        let corr = '';
        if(gr.mpiXMoa!=null && arma && arma.valorClick){
          const unidadM = arma.unidadClick==='MRAD';
          const k = unidadM ? (1/3.43775) : 1;     // MOA -> MRAD
          const cv = (gr.mpiYMoa*k)/arma.valorClick, ch = (gr.mpiXMoa*k)/arma.valorClick;
          corr = `<br>corregir: ${f(Math.abs(cv),0)} clicks ${cv>0?'abajo':'arriba'}, ${f(Math.abs(ch),0)} ${ch>0?'izquierda':'derecha'}`;
        }
        html += `<div class="stat" style="border-left:4px solid ${COLORES_G[(gr.g-1)%6]}"><b>${gr.esMoa!=null?f(gr.esMoa,2)+' MOA':f(gr.esMm,0)+' mm'}</b>
          <i>Grupo ${gr.g}: ${gr.n} tiros · ${f(gr.esMm,0)} mm<br>impacto medio: ${f(Math.abs(gr.mpiY),1)} cm ${gr.mpiY>=0?'arriba':'abajo'}, ${f(Math.abs(gr.mpiX),1)} cm ${gr.mpiX>=0?'derecha':'izquierda'}${corr}</i></div>`;
      }
      html += `</div><div class="acts"><button class="btn sec" id="dDeshacer">Deshacer último</button><button class="btn sec" id="dPasar">Pasar a "Grupos (mm)"</button></div>`;
    }
    box.innerHTML = html;
    const el = $('#dianaSvg');
    el.addEventListener('click', async ev => {
      const pt = el.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
      const q = pt.matrixTransform(el.getScreenCTM().inverse());
      const x = +q.x.toFixed(2), y = +(-q.y).toFixed(2);
      s.impactos = s.impactos || [];
      s.impactos.push({x, y, g});
      await persistir(); pintar();
    });
    box.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { g = +b.dataset.g; pintar(); });
    $('#gNuevo').onclick = () => { g = Math.max(0, ...(s.impactos||[]).map(p=>p.g), g) + 1; pintar(); };
    $('#dTam').onchange = async ev => { S = +ev.target.value; s.dianaCm = S; await persistir(); pintar(); };
    if($('#dDeshacer')) $('#dDeshacer').onclick = async () => { const i = s.impactos.map(p=>p.g).lastIndexOf(g); if(i>=0) s.impactos.splice(i,1); else s.impactos.pop(); await persistir(); pintar(); };
    if($('#dPasar')) $('#dPasar').onclick = async () => {
      const gs = analisisDiana(s).grupos.filter(x=>x.n>1);
      s.gruposMm = gs.map(x=>f(x.esMm,1)).join(', ');
      s.tirosPorGrupo = gs.length ? Math.round(gs.reduce((a,x)=>a+x.n,0)/gs.length) : s.tirosPorGrupo;
      if(!num(s.disparos)) s.disparos = (s.impactos||[]).length;
      await persistir(); toast('Grupos actualizados'); detalle('sesiones', s.id);
    };
  }

const CERO_KEY = 'mosca.cero';
const PERFIL_GENERICO = { bc:0.40, modelo:'G1', v0:800 };   // .308 de caza típico, para cuando no hay datos de la carga
let CZ = null;
function guardarCZ(){ try{ localStorage.setItem(CERO_KEY, JSON.stringify(CZ)); }catch(e){} }
function cmPorUnidad(D, unidad){ return unidad==='MRAD' ? D*0.1 : D*Math.tan(Math.PI/10800)*100; }   // cm que mueve 1 MOA / 1 MRAD a D metros
function perfilBal(){
  const c = CZ.carga || {};
  const real = !!(c.bc && c.v0);
  return { real, bc: c.bc || PERFIL_GENERICO.bc, modelo: c.modeloBC || PERFIL_GENERICO.modelo, v0: c.v0 || PERFIL_GENERICO.v0 };
}
// dónde tiene que pegar a la distancia D (cm sobre la línea de mira) para quedar en cero a Z
function alturaObjetivo(D, Z){
  if(Math.abs(D-Z) < 0.5) return 0;
  const pb = perfilBal();
  const t = Balistica.tablaDeTiro({ bc:pb.bc, modelo:pb.modelo, v0:pb.v0, alturaMira:CZ.alturaMira||4, ceroM:Z, tempC:20, presionHPa:1013, humedad:50 }, D, D);
  return t.length ? t[t.length-1].caidaCm : 0;
}
function curvaCero(Z){
  const pb = perfilBal();
  return Balistica.tablaDeTiro({ bc:pb.bc, modelo:pb.modelo, v0:pb.v0, alturaMira:CZ.alturaMira||4, ceroM:Z, tempC:20, presionHPa:1013, humedad:50 }, 300, 50).filter(r=>r.dist>0);

const cmSigno = v => { const r = Math.round(v); return r===0 ? '0' : (r>0?'+':'−')+Math.abs(r)+' cm'; };

function comprimir(file){
  return new Promise((res,rej)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const m = 1280, s = Math.min(1, m/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.8)); };
    img.onerror = rej; img.src = url;
  });
}

async function construirExport(conFotos){
  const datos = { app:'MOSCA', formato:1, exportado:new Date().toISOString(),
    unidad_preferida_usuario: UV(),
    unidades:{ velocidad:'m/s', peso:'grains', distancia:'m', grupos:'mm', altura_mira:'cm', presion:'hPa', temperatura:'°C', coal_cbto:'mm' } };
  for(const s of ['armas','cargas','sesiones','fundicion','consultas']) datos[s] = await todos(s);
  // resúmenes precalculados para que el agente no tenga que recalcular
  datos.resumen = { armas:[], cargas:[], sesiones:[] };
  for(const a of datos.armas) datos.resumen.armas.push({ id:a.id, nombre:a.nombre, disparos_totales: await conteoArma(a) });
  for(const c of datos.cargas){
    const ses = datos.sesiones.filter(s=>s.cargaId===c.id);
    const v = Balistica.estadisticaVelocidades(ses.flatMap(s=>lista(s.velocidades)));
    const gr = ses.map(s=>statsSesion(s).grupos).filter(Boolean);
    datos.resumen.cargas.push({ id:c.id, nombre:c.nombre, sesiones:ses.length, velocidad:v, mejor_grupo_moa: gr.length?Math.min(...gr.map(g=>g.mejorMoa)):null, grupo_promedio_moa: gr.length?gr.reduce((a,g)=>a+g.promMoa,0)/gr.length:null });
  }
  for(const s of datos.sesiones) datos.resumen.sesiones.push(Object.assign({ id:s.id, fecha:s.fecha }, statsSesion(s)));
  if(conFotos) datos.fotos = await todos('fotos');
  return datos;
}
async function exportar(){
  const datos = await construirExport($('#conFotos').checked);
  const nombre = `mosca-${hoy()}.json`;
  const blob = new Blob([JSON.stringify(datos,null,1)],{type:'application/json'});
  const file = new File([blob], nombre, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'MOSCA — datos de tiro'}); return; }catch(e){ if(e.name==='AbortError') return; }

}
async function importar(ev){

- Cargas de pólvora: los datos de partida salen SIEMPRE de un manual del fabricante. No inventes cargas, no pases los máximos publicados y explicá cómo trabajar una carga de a poco vigilando señales de presión. Si una carga anotada te parece peligrosa, avisalo primero.
- Las tablas calculadas se confirman tirando antes de usarlas sobre un animal.
- Terminá, si corresponde, con qué conviene probar en la próxima serie.`;

/* ---- proveedores por API (la clave queda solo en este teléfono) ---- */
const IA_KEY = 'mosca.ia';
let IACFG = { prov:'gemini', clave:'', modelo:'' };
try{ Object.assign(IACFG, JSON.parse(localStorage.getItem(IA_KEY)||'{}')); }catch(e){}
const guardarIACfg = () => { try{ localStorage.setItem(IA_KEY, JSON.stringify(IACFG)); }catch(e){} };
const PROVS = {
  gemini: { nombre:'Gemini (Google) — gratis', claveUrl:'https://aistudio.google.com/apikey' },
  claude: { nombre:'Claude (Anthropic) — pago por uso', claveUrl:'https://console.anthropic.com/settings/keys', modelo:'claude-sonnet-5-5' },
  openai: { nombre:'ChatGPT (OpenAI) — pago por uso', claveUrl:'https://platform.openai.com/api-keys', modelo:'gpt-6-luna' }
};
async function modeloGemini(clave){
  if(IACFG.modelo) return IACFG.modelo;
  if(IACFG._gem) return IACFG._gem;
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers:{'x-goog-api-key':clave} });
  if(!r.ok) throw new Error(await errorApi(r));
  const j = await r.json();
  const ok = (j.models||[]).filter(m => (m.supportedGenerationMethods||[]).includes('generateContent'))
    .map(m => m.name.replace('models/','')).filter(n => /flash/.test(n) && !/(image|tts|audio|live|embed|thinking|exp|preview)/.test(n));
  const pick = ok.find(n=>n==='gemini-flash-latest') || ok.sort().reverse().find(n=>!/lite/.test(n)) || ok[0];
  if(!pick) throw new Error('No encontré un modelo Flash disponible para tu clave. Escribí el nombre del modelo en Ajustes.');
  IACFG._gem = pick; guardarIACfg(); return pick;
}
async function errorApi(r){
  let t = ''; try{ const j = await r.json(); t = j.error?.message || j.error?.type || JSON.stringify(j).slice(0,200); }catch(e){ t = r.statusText; }
  if(r.status===401 || r.status===403 || /api key/i.test(t)) return 'La clave no es válida o no tiene permiso. Revisala en Más → Ajustes de IA. ('+t+')';
  if(r.status===429) return 'Llegaste al límite de consultas por ahora. Probá en un rato. ('+t+')';
  return `Error ${r.status}: ${t}`;
}
async function preguntarAPI(pregunta, contexto){
  const { prov, clave } = IACFG;
  if(!clave) throw new Error('Falta la clave de la IA. Cargala en Más → Ajustes de IA.');
  const usuario = `PREGUNTA: ${pregunta}\n\n${contexto}`;
  if(prov === 'gemini'){
    const modelo = await modeloGemini(clave);
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent`, {
      method:'POST', headers:{'content-type':'application/json','x-goog-api-key':clave},
      body: JSON.stringify({ systemInstruction:{parts:[{text:INSTRUCCIONES_IA}]}, contents:[{role:'user',parts:[{text:usuario}]}] }) });
    if(!r.ok){ if(r.status===404){ IACFG._gem=''; guardarIACfg(); } throw new Error(await errorApi(r)); }
    const j = await r.json();
    const txt = (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
    if(!txt) throw new Error('La IA no devolvió respuesta' + (j.promptFeedback?.blockReason ? ' (bloqueada: '+j.promptFeedback.blockReason+')' : '') + '.');
    return { texto:txt, modelo };
  }
  if(prov === 'claude'){
    const modelo = IACFG.modelo || PROVS.claude.modelo;
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'content-type':'application/json','x-api-key':clave,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({ model:modelo, max_tokens:2000, system:INSTRUCCIONES_IA, messages:[{role:'user',content:usuario}] }) });
    if(!r.ok) throw new Error(await errorApi(r));
    const j = await r.json();
    return { texto:(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('').trim(), modelo };
  }
  if(prov === 'openai'){
    const modelo = IACFG.modelo || PROVS.openai.modelo;
    const r = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST', headers:{'content-type':'application/json','authorization':'Bearer '+clave},
      body: JSON.stringify({ model:modelo, messages:[{role:'system',content:INSTRUCCIONES_IA},{role:'user',content:usuario}] }) });
    if(!r.ok) throw new Error(await errorApi(r));
    const j = await r.json();
    return { texto:(j.choices?.[0]?.message?.content||'').trim(), modelo };
  }
  throw new Error('Elegí una IA en Ajustes.');
}
// markdown mínimo: negritas, títulos y viñetas; el resto texto plano
function md(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[-*]\s+/gm,'• ');
}
async function contextoIA(){
  let ctx = await textoIA(null);
  const prev = (await todos('consultas')).sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,3).reverse();
  if(prev.length) ctx += `\nCONSULTAS ANTERIORES (para dar continuidad)\n` + prev.map(c=>`- ${c.fecha.slice(0,10)} P: ${c.pregunta}\n  R: ${c.respuesta.slice(0,600).replace(/\s+/g,' ')}`).join('\n') + '\n';
  return ctx;
}
function tarjetaConsulta(c, sesiones){
  const s = c.sesionId && sesiones[c.sesionId];
  return `<div class="card consulta" data-cid="${c.id}"><div class="q">${esc(c.pregunta)}</div>
    <div class="resp">${md(c.respuesta)}</div>
    <div class="meta">${new Date(c.fecha).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'})} · ${esc(c.modelo||c.proveedor||'')}${s?` · sesión ${esc(s.fecha)}`:''}
      · <a href="#" data-borrarc="${c.id}" style="color:var(--bad)">borrar</a></div></div>`;
}
async function vistaIA(sesionPre){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
  vista = 'ia';
  const sesionesArr = (await todos('sesiones')).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const sesiones = Object.fromEntries(sesionesArr.map(s=>[s.id,s]));
  const nombresArma = Object.fromEntries((await todos('armas')).map(a=>[a.id,a.nombre]));
  const hist = (await todos('consultas')).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const conClave = !!IACFG.clave;
  const sel = sesionPre || (sesionesArr[0] && sesionesArr[0].fecha===hoy() ? sesionesArr[0].id : '');
  app.innerHTML = `<h2>✦ Consultar a la IA</h2>
  <div class="card">
    <label for="iaPreg" style="margin-top:0">Tu pregunta</label>
    <textarea id="iaPreg" placeholder="Ej.: ¿qué carga me agrupó mejor? · ¿cuántos clicks corrijo? · ¿cuándo recuezo estas vainas?"></textarea>
    <label for="iaSes">Sesión relacionada (opcional)</label>
    <select id="iaSes"><option value="">—</option>${sesionesArr.slice(0,40).map(s=>`<option value="${s.id}"${s.id===sel?' selected':''}>${esc(s.fecha)} · ${esc(nombresArma[s.armaId]||'')} ${s.distanciaM?'· '+s.distanciaM+' m':''}</option>`).join('')}</select>
    ${conClave
      ? `<div class="acts"><button class="btn full" id="iaPreguntar" data-red>Preguntar a ${esc(PROVS[IACFG.prov].nombre.split(' —')[0])}</button></div>`
      : `<p class="nota">Para que la IA conteste acá y quede guardado, cargá una clave en <b>Más → Ajustes de IA</b> (Gemini es gratis). Mientras tanto podés abrir la consulta en otra app.</p>`}
    <div id="iaEstado"></div>
    <details style="margin-top:12px"><summary class="nota" style="cursor:pointer">Abrir en otra app o pegar una respuesta</summary>
      <div class="iagrid">
        <button class="btn sec" data-ia="claude" data-red>Abrir en Claude</button>
        <button class="btn sec" data-ia="chatgpt" data-red>Abrir en ChatGPT</button>
      </div>
      <div class="acts" style="margin-top:8px"><button class="btn sec" data-ia="copiar">Copiar (otra IA)</button></div>
      <label for="iaPegada">Respuesta que te dio la otra IA (para guardarla)</label>
      <textarea id="iaPegada" placeholder="Pegá acá la respuesta"></textarea>
      <div class="acts"><button class="btn sec" id="iaGuardarPegada">Guardar respuesta</button></div>
    </details>
  </div>
  <h2>Historial</h2>
  <div id="iaHist">${hist.length ? hist.map(c=>tarjetaConsulta(c,sesiones)).join('') : '<div class="vacio">Todavía no hay consultas guardadas.</div>'}</div>`;
  estadoRed();
  const guardarConsulta = async (pregunta, respuesta, extra) => {
    const c = Object.assign({ id:nuevoId(), fecha:new Date().toISOString(), pregunta, respuesta, sesionId:$('#iaSes').value||'' }, extra);
    await guardar('consultas', c); return c;
  };
  if($('#iaPreguntar')) $('#iaPreguntar').onclick = async () => {
    const pregunta = $('#iaPreg').value.trim();
    if(!pregunta){ toast('Escribí la pregunta'); return; }
    const b = $('#iaPreguntar'); b.disabled = true;
    $('#iaEstado').innerHTML = '<div class="cargando">Consultando…</div>';
    try{
      const r = await preguntarAPI(pregunta, await contextoIA());
      const c = await guardarConsulta(pregunta, r.texto, { proveedor:IACFG.prov, modelo:r.modelo, origen:'api' });
      $('#iaPreg').value = '';
      $('#iaEstado').innerHTML = '';
      const vacio = $('#iaHist .vacio'); if(vacio) vacio.remove();
      $('#iaHist').insertAdjacentHTML('afterbegin', tarjetaConsulta(c, sesiones));
      enganchar();
      $('#iaHist').scrollIntoView({behavior:'smooth'});
    }catch(e){
      $('#iaEstado').innerHTML = `<p class="nota" style="color:var(--bad)">${esc(e.message||e)}</p>`;
    }finally{ b.disabled = !navigator.onLine; }
  };
  app.querySelectorAll('[data-ia]').forEach(b => b.onclick = async () => {
    const texto = await textoIA($('#iaPreg').value.trim());
    const ok = await copiar(texto);
    const destino = b.dataset.ia;
    if(destino === 'copiar'){ toast(ok ? 'Copiado: pegalo en tu IA' : 'No se pudo copiar'); return; }
    const url = DESTINOS[destino] + encodeURIComponent(texto);
    if(url.length < 7000) window.open(url, '_blank');
    else { window.open(DESTINOS[destino].split('?')[0], '_blank'); toast('Datos copiados: pegalos en el chat'); }
  });
  $('#iaGuardarPegada').onclick = async () => {
    const resp = $('#iaPegada').value.trim();
    if(!resp){ toast('Pegá la respuesta primero'); return; }
    await guardarConsulta($('#iaPreg').value.trim() || '(consulta hecha en otra app)', resp, { proveedor:'pegada', modelo:'respuesta pegada', origen:'pegada' });
    toast('Respuesta guardada'); vistaIA($('#iaSes').value);
  };
  function enganchar(){
    app.querySelectorAll('[data-borrarc]').forEach(a => a.onclick = async ev => {
      ev.preventDefault(); if(!confirm('¿Borrar esta consulta?')) return;
      await borrar('consultas', a.dataset.borrarc); a.closest('.consulta').remove();
    });
  }
  enganchar();
}
function modoIA(){ vistaIA(); }
$('#btnIA').onclick = () => vistaIA();

/* ================= Botón Instalar ================= */
const instalada = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let pedidoInstalar = null;
const btnInst = $('#btnInstalar');
if(!instalada()) btnInst.style.display = '';
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedidoInstalar = e; if(!instalada()) btnInst.style.display = ''; });
window.addEventListener('appinstalled', () => { btnInst.style.display = 'none'; pedidoInstalar = null; toast('MOSCA instalada'); });
btnInst.onclick = async () => {
  if(pedidoInstalar){
    pedidoInstalar.prompt();
    const r = await pedidoInstalar.userChoice;
    if(r.outcome === 'accepted') btnInst.style.display = 'none';
    pedidoInstalar = null;
    return;
  }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const d = $('#dlg');
  d.innerHTML = `<h2>Instalar MOSCA</h2><p>${ios
    ? 'En Safari tocá el botón <b>Compartir</b> (el cuadrado con la flecha) y elegí <b>Agregar a pantalla de inicio</b>.'
    : 'En Chrome tocá el menú <b>⋮</b> (arriba a la derecha) y elegí <b>Instalar app</b> o <b>Agregar a la pantalla principal</b>.'}</p>
    <p class="nota">Una vez instalada, se abre desde su ícono y funciona sin señal.</p>
    <div class="acts"><button class="btn" id="cerrarInst">Entendido</button></div>`;
  d.showModal(); $('#cerrarInst').onclick = () => d.close();
};
